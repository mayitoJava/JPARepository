<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Agregar Usuario</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <style>
            body {
                background-color: #f8f9fa;
            }

            h1, h3 {
                font-family: 'Segoe UI', sans-serif;
            }

            .card {
                margin-bottom: 2rem;
                box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            }

            .form-control:focus {
                box-shadow: 0 0 8px #0d6efd;
                border-color: #0d6efd;
            }

            .error-message {
                color: red;
                font-size: 0.8rem;
            }
        </style>
    </head>

    <body class="container py-4">

        <div class="mb-3">
            <a class="btn btn-warning" th:href="@{/usuario}">
                <i class="bi bi-arrow-90deg-left"></i> Regresar
            </a>
        </div>

        <form method="post" th:object="${usuario}" th:action="@{add}" style="margin:2rem 0; display:flex; flex-direction:column;">
            <input type="hidden" th:field="${usuario.IdUsuario}">
            <input type="hidden" th:field="${usuario.Direcciones[0].IdDireccion}">
            <input type="hidden" id="estatus" th:field="${usuario.status}">

            <!-- SECCIÓN USUARIO -->
            <div class="card p-4">
                <h1 class="text-center mb-4">Agregar Usuario</h1>

                <div class="mb-3">
                    <label class="form-label fw-bold"><i class="bi bi-person-circle"></i> Nombres:</label>
                    <input type="text" placeholder="Nombres" class="form-control" th:field="*{nombre}" onkeypress="soloLetras(event, this)">
                    <span class="error-message" th:if="${#fields.hasErrors('nombre')}" th:errors="${usuario.nombre}"></span>
                </div>

                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label fw-bold">Apellido Paterno:</label>
                        <input type="text" class="form-control" placeholder="Paterno" th:field="*{apellidoPaterno}" onkeypress="soloLetras(event, this)">
                        <span class="error-message" th:if="${#fields.hasErrors('apellidoPaterno')}" th:errors="${usuario.apellidoPaterno}"></span>
                    </div>
                    <div class="col">
                        <label class="form-label fw-bold">Apellido Materno:</label>
                        <input type="text" class="form-control" placeholder="Materno" th:field="*{apellidoMaterno}" onkeypress="soloLetras(event, this)">
                        <span class="error-message" th:if="${#fields.hasErrors('apellidoMaterno')}" th:errors="${usuario.apellidoMaterno}"></span>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold"><i class="bi bi-envelope"></i> Correo:</label>
                    <input type="text" class="form-control" placeholder="Correo" th:field="*{email}" onblur="emailValidator(this)">
                    <span class="error-message" th:if="${#fields.hasErrors('email')}" th:errors='${usuario.email}'></span>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Contraseña:</label>
                    <input type="password" placeholder="Contraseña" class="form-control" th:field="*{password}" onblur="passVal(this)">
                    <span class="error-message" th:if="${#fields.hasErrors('password')}" th:errors ="${usuario.password}"></span>
                </div>

                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label fw-bold"><i class="bi bi-telephone"></i> Teléfono:</label>
                        <input type="number" placeholder="Telefono" class="form-control" th:field="*{telefono}" onblur="validarNumero(this)">
                        <span class="error-message" th:if="${#fields.hasErrors('telefono')}" th:errors="${usuario.telefono}"></span>
                    </div>
                    <div class="col">
                        <label class="form-label fw-bold"><i class="bi bi-phone"></i> Celular:</label>
                        <input type="number" placeholder="Celular" class="form-control" th:field="*{celular}" onblur="validarNumero(this)">
                        <span class="error-message" th:if="${#fields.hasErrors('celular')}" th:errors="${usuario.celular}"></span>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Sexo:</label><br>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="femenino" value="F" name="sexo" th:field="*{sexo}" th:checked="*{sexo == 'F'}">
                        <label class="form-check-label" for="femenino">Femenino</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="masculino" value="M" name="sexo" th:field="*{sexo}" th:checked="*{sexo == 'M'}">
                        <label class="form-check-label" for="masculino">Masculino</label>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label fw-bold">Fecha de Nacimiento:</label>
                        <input type="date" class="form-control" th:field="*{fechaNacimiento}" onblur="validarNacimiento(this)">
                        <span class="error-message" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors='${Usuario.fechaNacimiento}'></span>
                    </div>
                    <div class="col">
                        <label class="form-label fw-bold">CURP:</label>
                        <input type="text" placeholder="CURP" class="form-control" th:field="*{curp}" onblur="validarCurp(this)">
                        <span class="error-message" th:if="${#fields.hasErrors('curp')}" th:errors="${usuario.curp}"></span>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Rol:</label>
                    <select class="form-select" th:field="*{Rol.idRol}" onblur="validarRol(this)">
                        <option value="0">Elige tu rol</option>
                        <option th:each="rol:${rol}" th:text="${rol.nombre}" th:value="${rol.idRol}"></option>
                    </select>
                    <span class="error-message" th:if="${#fields.hasErrors('rol.idRol')}" th:errors="${usuario.IdRol}"></span>
                </div>
            </div>

            <!-- SECCIÓN DIRECCIÓN -->
            <div class="card p-4">
                <h3 class="mb-4">Dirección del Usuario</h3>

                <div class="mb-3">
                    <label class="form-label fw-bold">Calle:</label>
                    <input type="text" class="form-control" th:field="${usuario.Direcciones[0].calle}" onkeypress="validarCalle(event, this)">
                    <span class="error-message" th:if="${#fields.hasErrors('Direcciones[0].calle')}" th:errors="$(Direcciones[0].calle)"></span>
                </div>

                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label fw-bold">No. Interior:</label>
                        <input type="text" class="form-control" th:field="*{Direcciones[0].numeroInterior}">
                    </div>
                    <div class="col">
                        <label class="form-label fw-bold">No. Exterior:</label>
                        <input type="text" class="form-control" th:field="*{Direcciones[0].numeroExterior}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">País:</label>
                    <select class="form-select" id="ddlPais">
                        <option value="0">Elige un país</option>
                        <option th:each="pais:${pais}" th:value="${pais.idPais}" th:text="${pais.nombre}"></option>
                    </select>
                </div>

                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label fw-bold">Estado:</label>
                        <select class="form-select" id="ddlEstado">
                            <option value="0">Selecciona un Estado</option>
                        </select>
                    </div>
                    <div class="col">
                        <label class="form-label fw-bold">Municipio:</label>
                        <select class="form-select" id="ddlMunicipio">
                            <option value="0">Selecciona un Municipio</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Colonia:</label>
                    <select class="form-select" id="ddlColonia">
                        <option value="0">Selecciona la Colonia</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-success btn-lg mt-3">Guardar</button>
        </form>



        <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>

        <script>
                                function soloLetras(event, input) {

                                    let key = event.key;
                                    let regExpres = /[a-zA-ZÁÉÍÓÚáéíóú ]+/;
                                    let ascci = event.charCode;
                                    if (ascci == 32 || ascci >= 65 && ascci <= 90 || ascci >= 97 && ascci <= 122) {
                                        if (regExpres.test(key)) {
                                            $(input).removeClass("invalidText").addClass("correct");
                                            $(input).siblings(".error-message").text("");
                                        }

                                    } else {
                                        $(input).removeClass("correct").addClass("invalidText");
                                        $(input).siblings(".error-message").text(" Solo se permiten letras");
                                        setTimeout(() => {
                                            $(input).removeClass("invalidText");
                                            $(input).siblings(".error-message").text("");
                                        }, 3000);
                                        event.preventDefault();
                                    }


                                }


                                function emailValidator(thisInput) {
                                    let cadena = $(thisInput).val();
                                    const regExpres = /^([A-Z|a-z|0-9](\.|_){0,1})+[A-Z|a-z|0-9]\@([A-Z|a-z|0-9])+((\.){0,1}[A-Z|a-z|0-9]){2}\.[a-z]{2,3}$/;
                                    if (regExpres.test(cadena)) {
                                        console.log("Correo valido");
                                        $(thisInput).removeClass("invalidText").addClass("correct");
                                        setTimeout(() => {
                                            $(thisInput).removeClass("correct");
                                        }, 4000);
                                    } else {
                                        $(thisInput).addClass("invalidText");
                                        $("#emailMessage").text("Correo no valido");
                                        console.log("Correo no valido");
                                        setTimeout(() => {

                                            $("#emailMessage").text("");
                                            $(thisInput).removeClass("invalidText");
                                        }, 4000);
                                    }
                                }

                                function passVal(thisInput) {
                                    const regEx = /^(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[a-zA-Z]).{8,}$/;
                                    const inputText = $(thisInput).val();
                                    if (regEx.test(inputText) && inputText.length < 50) {
                                        $(thisInput).removeClass("invalidText").addClass("correct");
                                        //                                $(thisInput).siblings(".error-message").text("Correcto");
                                        setTimeout(() => {
                                            $(thisInput).removeClass("correct");
                                        }, 3700);
                                        console.log("Contraseña valida");
                                    } else {

                                        $(thisInput).removeClass("correct").addClass("invalidText");
                                        $(thisInput).siblings(".error-message").text("Contraseña no valida");
                                        setTimeout(() => {
                                            //                                     $(thisInput).removeClass("invalidText");
                                            $(thisInput).siblings(".error-message").text("");
                                        }, 3700);
                                        console.log("Contraseña no valida");
                                        console.log("Escribe una contraseña más corta");
                                    }


                                }
                                function validarNumero(thisInput) {

                                    const regExp = /^\s*(?:\+?(\d{1,3}))?([-. (]*(\d{3})[-. )]*)?((\d{3})[-. ]*(\d{2,4})(?:[-.x ]*(\d+))?)\s*$/;
                                    const cadena = $(thisInput).val();
                                    if (regExp.test(cadena) && cadena.length < 12) {
                                        $(thisInput).removeClass("invalidText").addClass("correct");
                                        //                                $(thisInput).siblings(".error-message").text("Correcto");
                                        setTimeout(() => {
                                            $(thisInput).removeClass("correct");
                                        }, 3700);
                                    } else {
                                        $(thisInput).removeClass("correct").addClass("invalidText");
                                        $(thisInput).siblings(".error-message").text("Numero no valido");
                                        setTimeout(() => {
                                            //                                     $(thisInput).removeClass("invalidText");
                                            $(thisInput).siblings(".error-message").text("");
                                        }, 3700);
                                    }


                                }

                                function validarSexo() {
                                    const seleccionado = $('input[name = "sexo"]:checked');
                                    if (seleccionado.length == 0) {
                                        console.log("Selecciona una opción");
                                    }


                                }

                                function validarNacimiento(thisInput) {
                                    const fecha = $(thisInput).val();
                                    const regEx = /([\d]+)([\-\./])([\d]+)([\-\./])([\d]+)|((Jan(|uary)|Feb(|ruary)|Mar(|ch)|Apr(|il)|May|Jun(|e)|Jul(|y)|Aug(|ust)|Sept(|ember)|Oct(|ober)|(Nov|Dec)(|ember))([\s\-])(|([\d]+){1,2}([\s\-]|\, ))([\d]+){4})/;
                                    if (regEx.test(fecha)) {
                                        $(thisInput).removeClass("invalidText").addClass("correct");
                                        //                               
                                        setTimeout(() => {
                                            $(thisInput).removeClass("correct");
                                        }, 3700);
                                    } else {
                                        $(thisInput).removeClass("correct").addClass("invalidText");
                                        $(thisInput).siblings(".error-message").text("Fecha no valida");
                                        setTimeout(() => {
                                            //                                     $(thisInput).removeClass("invalidText");
                                            $(thisInput).siblings(".error-message").text("");
                                        }, 3700);
                                    }

                                }

                                function validarCurp(thisInput) {
                                    const regExp = /[A-Z]{1}[AEIOU]{1}[A-Z]{2}[0-9]{2}(0[1-9]|1[0-2])(0[1-9]|1[0-9]|2[0-9]|3[0-1])[HM]{1}(AS|BC|BS|CC|CS|CH|CL|CM|DF|DG|GT|GR|HG|JC|MC|MN|MS|NT|NL|OC|PL|QT|QR|SP|SL|SR|TC|TS|TL|VZ|YN|ZS|NE)[B-DF-HJ-NP-TV-Z]{3}[0-9A-Z]{1}[0-9]{1}/;
                                    const texto = $(thisInput).val();
                                    if (regExp.test(texto)) {
                                        $(thisInput).removeClass("invalidText").addClass("correct");
                                        //                                $(thisInput).siblings(".error-message").text("Correcto");
                                        setTimeout(() => {
                                            $(thisInput).removeClass("correct");
                                        }, 3700);
                                    } else {
                                        $(thisInput).removeClass("correct").addClass("invalidText");
                                        $(thisInput).siblings(".error-message").text("CURP no valida");
                                        setTimeout(() => {
                                            //                                     $(thisInput).removeClass("invalidText");
                                            $(thisInput).siblings(".error-message").text("");
                                        }, 3700);
                                    }

                                }

                                function validarRol(thisInput) {
                                    const valor = $(thisInput).val();
                                    if (valor != 0) {
                                        $(thisInput).removeClass("invalidText").addClass("correct");
                                        setTimeout(() => {
                                            $(thisInput).removeClass("correct");
                                        }, 3700);
                                    } else {
                                        $(thisInput).removeClass("correct").addClass("invalidText");
                                        $(thisInput).siblings(".error-message").text("rol no valido");
                                        setTimeout(() => {
                                            //                                     $(thisInput).removeClass("invalidText");
                                            $(thisInput).siblings(".error-message").text("");
                                        }, 3700);
                                    }
                                }

                                function validarCalle(event, thisInput) {
                                    const regExp = "/[a-zA-ZÁÉÍÓÚáéíóú0-9 ]+/";
                                    const letra = event.key;
                                    if (regExp.test(letra)) {
                                        $(thisInput).removeClass("invalidText").addClass("correct");
                                        //                                $(thisInput).siblings(".error-message").text("Correcto");
                                        setTimeout(() => {
                                            $(thisInput).removeClass("correct");
                                        }, 3700);
                                    } else {
                                        $(thisInput).removeClass("correct").addClass("invalidText");
                                        $(thisInput).siblings(".error-message").text("Numero no valido");
                                        setTimeout(() => {
                                            //                                     $(thisInput).removeClass("invalidText");
                                            $(thisInput).siblings(".error-message").text("");
                                        }, 3700);
                                        event.preventDefault();
                                    }
                                }

                                $(document).ready(function () {
                                    $("#ddlPais").change(function () {

                                        if ($("#ddlPais").val() == 0) {
                                            $("#ddlEstado").empty();
                                            $("#ddlEstado").append(" <option>Selecciona un Estado</option>");
                                        } else {

                                            //ajax para manejra peticiones asincronas
                                            $.ajax({
                                                url: "/Usuario/getEstadoByPais/" + $("#ddlPais").val(), //url de la peticion
                                                method: "GET", //tipo de accion
                                                dataType: 'json', // tipos de datos
                                                //Cuando la peticion fue exitosa:
                                                success: function (data, textStatus, jqXHR) {
                                                    if (data.Correct) {
                                                        //vacia el ddl para que no se dupliquen al ejecutar varias veces la acción
                                                        $("#ddlEstado").empty();
                                                        $("#ddlEstado").append(" <option value=0>Selecciona un Estado</option>");
                                                        //itera sobre la lista de objetos y ejecuta la funcion de al lado
                                                        $.each(data.Objects, function (i, estado) {
                                                            //En el input con el id: ddlEstado agrega una option con valores traidos de la petición
                                                            $("#ddlEstado").append("<option value=" + estado.idEstado + ">" + estado.nombre + "</option>");
                                                        });
                                                    }
                                                },
                                                //Cuando hubo error en la petición 
                                                error: function (jqXHR, textStatus, errorThrown) {
                                                    alert(textStatus);
                                                }





                                            });
                                        }




                                    });
                                });
                                $(document).ready(function () {
                                    $("#estatus").val(1);
                                    $("#ddlEstado").change(function () {

                                        if ($("#ddlEstado").val() == 0) {
                                            $("#ddlMunicipio").empty();
                                            $("#ddlMunicipio").append(" <option value=0>Selecciona un Municipio</option>");
                                        } else {
                                            $.ajax({
                                                url: "/Usuario/getMunicipioByEstado/" + $("#ddlEstado").val(),
                                                method: "GET", //tipo de accion
                                                dataType: 'json', // tipos de datos
                                                success: function (data, textStatus, jqXHR) {

                                                    if (data.Correct) {
                                                        $("#ddlMunicipio").empty();
                                                        $("#ddlMunicipio").append(" <option value=0>Selecciona un Municipio</option>");
                                                        $.each(data.Objects, function (i, municipio) {
                                                            //                                                En el input con el id: ddlEstado agrega una option con valores traidos de la petición
                                                            $("#ddlMunicipio").append("<option value=" + municipio.idMunicipio + ">" + municipio.nombre + "</option>");
                                                        });
                                                    }

                                                },
                                                error: function () {
                                                    alert("Hubo un error...");
                                                }
                                            });
                                        }
                                    });
                                });
                                $(document).ready(function () {
                                    $("#ddlMunicipio").change(function () {

                                        if ($("#ddlMunicipio").val() == 0) {
                                            $("#ddlColonia").empty();
                                            $("#ddlColonia").append(" <option value=0>Selecciona la Colonia</option>");
                                        } else {
                                            //                                
                                            $.ajax({
                                                url: "/Usuario/getColoniaByMunicipio/" + $("#ddlMunicipio").val(),
                                                method: "GET",
                                                dataType: 'json',
                                                success: function (data, textStatus, jqXHR) {
                                                    if (data.Correct) {
                                                        $("#ddlColonia").empty();
                                                        $("#ddlColonia").append(" <option value=0>Selecciona la Colonia</option>");
                                                        $.each(data.Objects, function (i, colonia) {
                                                            $("#ddlColonia").append("<option value=" + colonia.idColonia + ">" + colonia.nombre + "</option>");
                                                        });
                                                        //                                             
                                                    }
                                                    ;
                                                    //                                         if (data.Correct) {
                                                    //                                            $("#ddlMunicipio").empty();
                                                    //                                            $("#ddlMunicipio").append(" <option value=0>Selecciona un Municipio</option>");
                                                    //                                            $.each(data.Objects, function (i, municipio) {
                                                    ////                                                En el input con el id: ddlEstado agrega una option con valores traidos de la petición
                                                    //                                                $("#ddlMunicipio").append("<option value=" + municipio.idMunicipio + ">" + municipio.nombre + "</option>");
                                                    //                                            });
                                                    //                                        }
                                                },
                                                error: function () {
                                                    alert("Algo salió mal...");
                                                }
                                            });
                                        }
                                    });
                                });
        </script>






    </body>
</html>
